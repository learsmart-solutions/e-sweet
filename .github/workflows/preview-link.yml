# Backup preview-link comment: when Cloudflare's "Workers Builds: e-sweet"
# check finishes on a pull request, post (or update) one comment with the
# preview URL, the build result and its logs. See .github/scripts/preview-comment.cjs.
#
# check_run workflows always run from the copy of this file on main, so a
# change here only takes effect after it's merged.
name: Preview link

on:
  check_run:
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    name: Post preview link
    if: >-
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.name == 'Workers Builds: e-sweet' &&
      github.event.check_run.head_branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/preview-comment.cjs');
            await run({ github, context, core });
